<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="size-medium">
  <div id="app">
    <div id="message" class="hidden"></div>
    <div id="grid" class="grid cols-unlimited"></div>
  </div>

  <div id="sync-status" class="sync-status hidden"></div>

  <!-- Floating action controls -->
  <div class="floating-controls">
    <button id="add-bookmark-btn" class="ctrl-btn" title="Add Bookmark" aria-label="Add Bookmark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button id="settings-btn" class="ctrl-btn" title="Speed Dial Settings" aria-label="Settings">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <!-- Right-Click Context Menu -->
  <div id="context-menu" class="context-menu hidden">
    <button type="button" class="context-menu-item" data-action="newtab">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      <span>Open in new tab</span>
    </button>
    <button type="button" class="context-menu-item" data-action="backgroundtab">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="16" height="15" rx="2" ry="2"></rect>
        <path d="M6 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2"></path>
      </svg>
      <span>Open in background tab</span>
    </button>
    <button type="button" class="context-menu-item" data-action="newwindow">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
      </svg>
      <span>Open in new window</span>
    </button>
    <button type="button" class="context-menu-item" data-action="privatewindow">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="14" r="4"></circle>
        <circle cx="18" cy="14" r="4"></circle>
        <line x1="10" y1="14" x2="14" y2="14"></line>
        <path d="M4 10l2-6 6 2 6-2 2 6"></path>
      </svg>
      <span>Open in new private window</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item" data-action="edit">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span>Edit</span>
    </button>
    <button type="button" class="context-menu-item danger" data-action="delete">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
      <span>Delete</span>
    </button>
  </div>

  <!-- Add Bookmark Modal Dialog -->
  <div id="add-modal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>➕ Add Bookmark</h3>
        <button id="add-modal-close" class="modal-close-btn" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="add-bookmark-form">
        <div class="modal-field">
          <label for="bm-url">URL <span style="color:#f38ba8">*</span></label>
          <input type="text" id="bm-url" placeholder="https://example.com" required autocomplete="off">
        </div>
        <div class="modal-field">
          <label for="bm-name">Name / Title (Optional)</label>
          <input type="text" id="bm-name" placeholder="Leave empty to auto-fetch title" autocomplete="off">
        </div>
        <div class="modal-field">
          <label for="bm-collection">Collection</label>
          <select id="bm-collection">
            <option value="">Default (Unorganized)</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="add-modal-cancel" class="btn-cancel">Cancel</button>
          <button type="submit" id="add-modal-submit" class="btn-primary">Add Bookmark</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Bookmark Modal Dialog -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>✏️ Edit Bookmark</h3>
        <button id="edit-modal-close" class="modal-close-btn" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="edit-bookmark-form">
        <div class="modal-field">
          <label for="edit-bm-url">URL <span style="color:#f38ba8">*</span></label>
          <input type="text" id="edit-bm-url" placeholder="https://example.com" required autocomplete="off">
        </div>
        <div class="modal-field">
          <label for="edit-bm-name">Name / Title</label>
          <input type="text" id="edit-bm-name" placeholder="Bookmark Title" autocomplete="off">
        </div>
        <div class="modal-field">
          <label for="edit-bm-collection">Collection</label>
          <select id="edit-bm-collection">
            <option value="">Default (Unorganized)</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="edit-modal-cancel" class="btn-cancel">Cancel</button>
          <button type="submit" id="edit-modal-submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
